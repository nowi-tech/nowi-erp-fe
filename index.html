<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon per browser theme. The dark-scheme (light ink) link comes FIRST
         and the light-scheme one LAST on purpose: a browser that ignores the
         `media` attribute takes the last matching icon, so it lands on the
         original dark wordmark and behaviour is unchanged for it. -->
    <link
      rel="icon"
      type="image/png"
      href="/logo-light.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/logo-bg-removed.png"
      media="(prefers-color-scheme: light)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14213d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <title>NOWI — Production</title>
  </head>
  <body>
    <div id="root">
      <!-- First-paint loader. React replaces #root on mount, so this
           vanishes automatically. Covers the gap between the WebView
           painting this HTML and the app rendering (and the moment the
           native splash hands off), so the screen is never blank. -->
      <div
        id="app-bootstrap"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #ffffff;
          font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        "
      >
        <img
          src="/logo-bg-removed.png"
          alt="NOWI ERP"
          style="height: 44px; width: auto"
        />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
